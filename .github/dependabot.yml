version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - dependencies
      - go
    # Block major version bumps; minor and patch updates are allowed.
    ignore:
      - dependency-type: all
        update-types:
          - version-update:semver-major
